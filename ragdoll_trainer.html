<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Equilibria</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f2f2;--fg:#111;--btn:#ddd;--panel:#ffffffd9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--btn:#333;--panel:#222d}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--btn:#333;--panel:#222d}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
button{font:600 15px system-ui,Arial,sans-serif;padding:11px 14px;border:0;border-radius:10px;background:var(--btn);color:var(--fg)}
#hint{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;opacity:.7;pointer-events:none;padding:0 8px}
#panels{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 150px);overflow:auto;max-width:calc(100% - 16px)}
details{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;backdrop-filter:blur(6px)}
summary{font-weight:600;padding:2px 0}
label{display:flex;align-items:center;gap:8px;padding:5px 0;white-space:nowrap}
details input[type=checkbox]{width:18px;height:18px;margin:0}
details input[type=number]{width:54px;font-size:14px;padding:3px}
.row{display:flex;gap:8px;padding:5px 0;flex-wrap:wrap}
details button{font-size:14px;padding:8px 12px}
#info{font-size:12px;line-height:1.45;font-variant-numeric:tabular-nums;white-space:pre-wrap;max-width:300px}
#chart{width:220px;height:70px;display:block;margin-top:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panels">
<details id="trn" open>
  <summary>Train (evolution strategies)</summary>
  <div class="row"><button id="bTrain">Start training</button><button id="bResetP">Reset policy</button><button id="bTest">Test</button></div>
  <div id="info">Generation 0</div>
  <canvas id="chart" width="440" height="140"></canvas>
  <label>Pairs <input type="number" id="nPairs" value="16" min="2" max="64"> Scenarios <input type="number" id="nScen" value="3" min="1" max="8"></label>
  <label>Workers <input type="number" id="nWork" value="-1" min="-1" max="16"> <span style="opacity:.6">-1 = auto, 0 = none</span></label>
  <label><input type="checkbox" id="oNN" checked> Neural reactions (shows what it senses)<label>
  <label><input type="checkbox" id="oUse"> Use old ES policy (watch it)</label>
  <label><input type="checkbox" id="oReflex" checked> Balance reflex</label>
  <label><input type="checkbox" id="oBal2" checked> New balance + recovery steps</label>
  <label><input type="checkbox" id="oStep" checked> Old step reflex (if New balance off)</label>
  <label><input type="checkbox" id="oFall"> Fall &amp; landing reflex (experimental)</label>
  <label><input type="checkbox" id="oSmooth" checked> Train for smooth, human-like motion</label>
  <label><input type="checkbox" id="oSoft" checked> Soft start: ease into standing</label>
  <div class="row"><button id="bSave">Save file</button><button id="bLoad">Load file</button></div>
  <input type="file" id="fIn" accept=".json,application/json" style="display:none">
  <div class="row"><button id="pL">&#9664; Push</button><button id="pR">Push &#9654;</button></div>
  <label>Strength <input type="range" id="pS" min="0.1" max="3" step="0.1" value="1" style="width:110px;height:auto"></label>
</details>
<details id="dbg">
  <summary>Debug</summary>
  <label><input type="checkbox" id="oBox" checked> Boxes</label>
  <label><input type="checkbox" id="oSkel"> Skeleton</label>
  <label><input type="checkbox" id="oJoint"> Joints</label>
  <label><input type="checkbox" id="oCom"> COM &amp; support</label>
  <label><input type="checkbox" id="oPD" checked> Pose (PD on)</label>
  <label><input type="checkbox" id="oSlow"> Slow-mo</label>
</details>
</div>
<div id="hint">1 finger: drag ragdoll or pan · 2 fingers: zoom</div>
<div id="bar">
  <button id="bSpawn">Spawn</button>
  <button id="bDrop">Drop</button>
  <button id="bFall">Fallen</button>
  <button id="bReset">Reset</button>
  <button id="bIn">+</button>
  <button id="bOut">&minus;</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js"></script>

    for(k=0;k<NJ;k++){
      var t=out[k]*ASC[k];
      if(k===8||k===14)t+=tA;else if(k===6||k===12)t+=tH+addH;else if(k===7||k===13)t+=addK;
      else if(k===0)t+=neck;else if(k===3||k===9)t+=sh;else if(k===4||k===10)t+=el;
      tt[k]=t;
    }
    if(rf&&FLAGS.bal2)bal2(rig,tt,out,ca,dt);
    if(rf&&FLAGS.nn)nnReact(rig,tt,dt);
    else if(rf&&FLAGS.step)stepReflex(rig,tt,ca,dt);
    // target smoothing: the network can slow it down (smoother) or speed it up; soft start eases in after spawning
    var al=clampA(FILT*(1+0.6*out[O_FILT]),1);
    if(rig.age<FLAGS.softT){var x=rig.age/FLAGS.softT;al*=0.04+0.96*x*x*(3-2*x);}
    rig.age+=dt;
    for(k=0;k<NJ;k++){
      rig.tgt[k]+=(tt[k]-rig.tgt[k])*al;
      rig.ctrls[k].target=rig.tgt[k];
    }
    return out;
  }

  // =====================================================================
  // SCENARIOS + EPISODE
  //  stand: tiny random perturbation   push: 1-3 pushes anywhere   drop: thrown/dropped with a random pose
  //  fallen: starts lying (back, front or crumpled) and has to get up
  // =====================================================================
  var CASES=['stand','push','drop','fallen'];
  function clampPose(p,s){for(var k=0;k<NJ;k++){var j=JT[k];p[k]=Math.max(j.lo*0.9,Math.min(j.hi*0.9,p[k]));}return p;}
  function sampleScenario(r,cfg){
    var u=r(),type=cfg.only||(u<0.2?'stand':u<0.55?'push':u<0.8?'drop':'fallen');
    var sc={type:type,pose:new Float64Array(NJ),rootAng:0,h:0,T:8,pushes:[],vel:null,
      mass:1+0.15*(2*r()-1),fric:0.7+0.5*r(),gain:0.9+0.2*r(),delay:Math.floor(r()*4),noise:0.01*r(),partVar:ORDER.map(function(){return 1+0.1*(2*r()-1);}),clear:0.02};
    var k;
    if(type==='stand'){
      for(k=0;k<NJ;k++)sc.pose[k]=0.06*(2*r()-1);
      clampPose(sc.pose);sc.rootAng=0.04*(2*r()-1);sc.T=6;
    }else if(type==='push'){
      sc.T=9;var n=1+Math.floor(r()*3),t=0.8;
      for(k=0;k<n;k++){
        t+=0.2+r()*1.6;
        var tgt=[1,1,1,3,0,2,7,13][Math.floor(r()*8)];
        sc.pushes.push({t:t,body:tgt,jx:(r()<0.5?-1:1)*(0.3+r()*(cfg.pushMax-0.3))*(tgt===1||tgt===3?1:0.5),jy:0.3*(2*r()-1)});
      }
      sc.T=Math.max(8,t+3.5);
    }else if(type==='drop'){
      for(k=0;k<NJ;k++)sc.pose[k]=0.5*(2*r()-1)*(JT[k].g===2?1.2:0.8);
      clampPose(sc.pose);sc.rootAng=0.5*(2*r()-1);sc.h=0.05+r()*0.8;
      sc.vel={vx:(2*r()-1)*1.0,vy:(2*r()-1)*0.5,w:(2*r()-1)*1.5};sc.T=9;
    }else{ // fallen
      var side=r()<0.5?1:-1;
      sc.rootAng=side*(1.1+0.5*r());
      var crumple=r()<0.5;
      for(k=0;k<NJ;k++)sc.pose[k]=crumple?(JT[k].lo*0.6+(JT[k].hi-JT[k].lo)*0.6*r()):0.15*(2*r()-1);
      clampPose(sc.pose);sc.clear=0.01;sc.T=11;
    }
    return sc;
  }

  // returns the reward gathered over the episode (about 60 per simulated second at best)
  function runEpisode(theta,seed,cfg){
    cfg=cfg||{};cfg.pushMax=cfg.pushMax||1.5;
    if(cfg.flags)for(var fk_ in cfg.flags)FLAGS[fk_]=cfg.flags[fk_]; // which reflexes are active for this episode
    var r=rngMake(seed),sc=sampleScenario(r,cfg),rr=rngMake(seed^0x9e3779b9);
    var w=new planck.World({gravity:Vec2(0,-10)});
    var gd=w.createBody();gd.createFixture(Box(1000,1,Vec2(0,-1),0),{friction:sc.fric});
    var rig=buildRig(w,0,0,-1,{pose:sc.pose,rootAng:sc.rootAng,h:sc.h,mass:sc.mass,fric:sc.fric,gain:sc.gain,partVar:sc.partVar,clear:sc.clear});
    if(sc.vel)rig.parts.forEach(function(b){b.setLinearVelocity(Vec2(sc.vel.vx,sc.vel.vy));b.setAngularVelocity(sc.vel.w);});
    var buf=newBuf(),hz=POLICY_HZ,steps=Math.round(sc.T*hz),scale=60/hz,total=0,cs=rig.ctrls,head=rig.parts[0],chest=rig.parts[1];
    var pi=0,lastDist=sc.type==='fallen'||sc.type==='drop'?0:-9,landed=false,quietT=0,lieT=0,rateAvg=0,opt={delay:sc.delay,noise:sc.noise,reflex:cfg.noReflex?false:true};
    var done=false,i,k;
    for(i=0;i<steps&&!done;i++){
      var t=i/hz;
      while(pi<sc.pushes.length&&t>=sc.pushes[pi].t){
        var p=sc.pushes[pi++],b=rig.parts[p.body];b.applyLinearImpulse(Vec2(p.jx,p.jy),b.getWorldCenter(),true);lastDist=t;
      }
      var out=act(rig,theta,buf,rr,opt);
      for(var s=0;s<SUB;s++){pdRig(rig);w.step(DT,VEL_IT,POS_IT);}
      var hp=head.getPosition(),hy=hp.y,ca=wrap(chest.getAngle());
      if(!(hy===hy)||Math.abs(hp.x)>50||hy>20)break; // blew up
      if(!landed&&sc.type==='drop'&&(rig.fc[0]||rig.fc[1])){landed=true;lastDist=t;}
      var upright=Math.cos(ca)>0.85&&hy>1.45;
      if(!upright&&sc.type!=='stand')lastDist=Math.max(lastDist,t-0.3);
      var e2=0,le=0,da=0,jv=0,eff=0,q;
      for(k=0;k<NJ;k++){
        var a=cs[k].j.getJointAngle();e2+=a*a;
        q=out[k];da+=Math.abs(q-rig.prev[k]);rig.prev[k]=q;
        jv+=Math.abs(cs[k].j.getJointSpeed());eff+=Math.abs(cs[k].t);
      }
      for(k=6;k<9;k++){var la=cs[k].j.getJointAngle(),lb=cs[k+6].j.getJointAngle();le+=la*la+lb*lb;}
      var split=Math.abs(cs[6].j.getJointAngle()-cs[12].j.getJointAngle())+Math.abs(cs[7].j.getJointAngle()-cs[13].j.getJointAngle())+Math.abs(cs[8].j.getJointAngle()-cs[14].j.getJointAngle());
      var up=Math.exp(-8*ca*ca),pose=Math.exp(-6*e2/15),legs=Math.exp(-25*le/6),hh=Math.exp(-30*(hy-1.735)*(hy-1.735));
      var hn=Math.max(0,Math.min(1,hy/1.735));
      // while a reflex is doing its job (step, landing, bracing) don't punish the posture it needs
      var reactive=rig.st.ph>0||rig.fallT>0||rig.landT>0||rig.airT>0.15;
      if(reactive){pose=1;legs=1;split=0;da=0;jv*=0.25;}
      var stand=0.3*up+0.25*pose+0.25*legs+0.2*hh,prog=0.25*hn*hn+0.15*Math.max(0,Math.cos(ca));
      var calm=Math.min(1,Math.max(0.15,(t-lastDist)/1.2));
      // with bal2 the drift is measured from the feet, (while standing) so a recovery step that ends somewhere else isn't punished
      var pen=calm*(2.0*split+2.0*da/NJ+1.0*jv/NJ+0.5*Math.abs(rig.com.vx)+1.0*Math.max(0,Math.abs(rig.com.x-(FLAGS.bal2&&rig.com.contact&&hy>1.2?(rig.lo+rig.hi)/2:0))-0.05)+0.1*eff/NJ);
      var hum=0;
      if(FLAGS.smooth){
        // smooth & human-like: penalise jerky commands and joint accelerations (twitching), hardest just after an upright start;
        // once nothing is happening, pay for calm stillness, a level head and relaxed (not co-contracted) joints
        var jk=0,acc=0,rx=0;
        for(k=0;k<NO;k++){jk+=Math.abs(out[k]-2*rig.prevO[k]+rig.prevO2[k]);rig.prevO2[k]=rig.prevO[k];rig.prevO[k]=out[k];}
        for(k=0;k<NJ;k++){var wv=cs[k].j.getJointSpeed();acc+=Math.abs(wv-rig.prevW[k]);rig.prevW[k]=wv;rx+=rig.stiff[k];}
        if(i<2){jk=0;acc=0;} // no history yet
        var startW=(sc.type==='stand'||sc.type==='push')?1+3*Math.exp(-t/0.8):1;
        hum=-startW*(reactive?0.3:1)*(1.5*jk/NO+3.0*Math.min(acc/NJ,0.05)); // capped: hard impacts are physics, not twitching
        if(upright&&!reactive){
          var ha=wrap(head.getAngle());
          hum+=calm*(0.15*Math.exp(-jv/NJ/0.05)*Math.exp(-Math.abs(rig.com.vx)/0.05)+0.05*Math.exp(-10*ha*ha)+0.1*(1-rx/NJ));
        }
      }
      var rew=scale*(0.6*stand+prog-pen+hum);
      total+=rew;rateAvg=rateAvg*0.98+rew*0.02;
      // early stop: standing still and no disturbance left -> assume it stays that way; lying motionless -> give up
      var lastPushT=sc.pushes.length?sc.pushes[sc.pushes.length-1].t:0;
      if(upright&&jv/NJ<0.05&&Math.abs(rig.com.vx)<0.03&&t>lastPushT+1.5&&(sc.type!=='drop'||landed)){quietT+=1/hz;}else quietT=0;
      if(quietT>1.2){total+=(steps-i-1)*rateAvg/(1-0.98)*0.02;done=true;}
      if(hy<0.6&&jv/NJ<0.05&&Math.abs(rig.com.vx)<0.03&&sc.type!=='fallen')lieT+=1/hz;else if(hy>=0.6)lieT=0;
      if(lieT>2.5){total+=(steps-i-1)*rateAvg/(1-0.98)*0.02;done=true;}
    }
    return total;
  }
  // mean over K scenarios (the same K for every candidate in a generation: common random numbers)
  function evalCandidate(theta,seed,K,cfg){
    var s=0;for(var k=0;k<K;k++)s+=runEpisode(theta,seed*131+k*7+1,cfg);
    return s/K;
  }

  // =====================================================================
  // EVOLUTION STRATEGIES helpers (antithetic sampling, centred ranks, Adam)
  // =====================================================================
  function esNoise(P,n,seed){var r=rngMake(seed),out=[];for(var i=0;i<P;i++){var e=new Float64Array(n);for(var k=0;k<n;k++)e[k]=gauss(r);out.push(e);}return out;}
  function esStep(S,eps,Fp,Fm,sigma,lr){
    var P=eps.length,n=S.theta.length,all=Fp.concat(Fm),i,k;
    var idx=all.map(function(_,j){return j;}).sort(function(a,b){return all[a]-all[b];});
    var rank=new Array(all.length);idx.forEach(function(j,q){rank[j]=q/(all.length-1)-0.5;});
    var g=new Float64Array(n);
    for(i=0;i<P;i++){var d=rank[i]-rank[P+i],e=eps[i];for(k=0;k<n;k++)g[k]+=d*e[k];}
    S.t++;var b1=0.9,b2=0.999;
    for(k=0;k<n;k++){
      g[k]/=(2*P*sigma);
      S.m[k]=b1*S.m[k]+(1-b1)*g[k];S.v[k]=b2*S.v[k]+(1-b2)*g[k]*g[k];
      var mh=S.m[k]/(1-Math.pow(b1,S.t)),vh=S.v[k]/(1-Math.pow(b2,S.t));
      S.theta[k]+=lr*mh/(Math.sqrt(vh)+1e-8);
    }
    var sum=0,best=-1e9;all.forEach(function(f){sum+=f;if(f>best)best=f;});
    return {mean:sum/all.length,best:best};
  }

  return {DCLS:DCLS,DIN:DIN,detFeat:detFeat,detForward:detForward,setDet:function(w){DET=w;},hasDet:function(){return !!DET;},FLAGS:FLAGS,buildRig:buildRig,pdRig:pdRig,act:act,sense:sense,newBuf:newBuf,forward:forward,initParams:initParams,rngMake:rngMake,gauss:gauss,
    esNoise:esNoise,esStep:esStep,migrate:migrate,runEpisode:runEpisode,evalCandidate:evalCandidate,sampleScenario:sampleScenario,fk:fk,
    NP:NP,NI:NI,NO:NO,NJ:NJ,DT:DT,SUB:SUB,POLICY_HZ:POLICY_HZ,VEL_IT:VEL_IT,POS_IT:POS_IT,JT:JT,ORDER:ORDER,CASES:CASES,wrap:wrap};
})();

</script>
<script>
(function(){
  var hint=document.getElementById('hint');
  window.onerror=function(m){hint.textContent='Error: '+m;};
  if(typeof planck==='undefined'||typeof RS==='undefined'){hint.textContent='Planck failed to load.';return;}
  var Vec2=planck.Vec2,Box=planck.Box,cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var world,ground,group=0,drag=null,W=0,H=0,dpr=1,rigs=[],stepCount=0,liveRng=RS.rngMake(12345);
  var cam={x:0.2,y:0,z:110};
  var DT=RS.DT,SUB=RS.SUB,NP=RS.NP;
  function opt(id){return document.getElementById(id).checked;}
  function num(id,d){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?d:v;}

  function resize(){
    dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  }
  addEventListener('resize',resize);resize();
  cam.y=0.2*H/cam.z+0.1;
  function toWorld(sx,sy){return Vec2(cam.x+(sx-W/2)/cam.z,cam.y-(sy-H/2)/cam.z);}
  function toScreen(p){return {x:W/2+(p.x-cam.x)*cam.z,y:H/2-(p.y-cam.y)*cam.z};}
  function setZoom(z,sx,sy){
    var w=toWorld(sx,sy);cam.z=Math.max(15,Math.min(600,z));
    cam.x=w.x-(sx-W/2)/cam.z;cam.y=w.y+(sy-H/2)/cam.z;
  }

  // =====================================================================
  // TRAINING: evolution strategies, candidates evaluated in parallel Web Workers (main-thread fallback)
  // =====================================================================
  var ES={theta:RS.initParams(7),m:new Float64Array(NP),v:new Float64Array(NP),t:0,gen:0,hist:[],sigma:0.01,lr:0.004,pushMax:1.5,done:0,total:0};
  var ZERO_TH=new Float64Array(NP); // untrained policy (all outputs 0): standing pose + reflexes
  function esReset(){ES.theta=RS.initParams(7);ES.m=new Float64Array(NP);ES.v=new Float64Array(NP);ES.t=0;ES.gen=0;ES.hist=[];ES.done=0;ES.total=0;}

  var pool={workers:[],ok:0,mode:'main',queue:[],pending:0};
  function workerSource(){
    var src=document.getElementById('simsrc').textContent;
    return "importScripts('https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js');\n"+src+
      "\nonmessage=function(e){var d=e.data;if(d.type==='ping'){postMessage({type:'pong'});return;}"+
      "var f=RS.evalCandidate(d.theta,d.seed,d.K,d.cfg);postMessage({type:'res',id:d.id,f:f});};";
  }
  function stopWorkers(){pool.workers.forEach(function(w){try{w.terminate();}catch(e){}});pool.workers=[];pool.ok=0;pool.mode='main';}
  function startWorkers(n){
    stopWorkers();
    if(n<=0||typeof Worker==='undefined'||typeof Blob==='undefined'||!window.URL||!URL.createObjectURL)return Promise.resolve(0);
    var url;
    try{url=URL.createObjectURL(new Blob([workerSource()],{type:'application/javascript'}));}catch(e){return Promise.resolve(0);}
    var waits=[];
    for(var i=0;i<n;i++){
      waits.push(new Promise(function(res){
        var w;try{w=new Worker(url);}catch(e){res(null);return;}
        var timer=setTimeout(function(){try{w.terminate();}catch(e){}res(null);},6000);
        w.onerror=function(){clearTimeout(timer);try{w.terminate();}catch(e){}res(null);};
        w.onmessage=function(ev){if(ev.data&&ev.data.type==='pong'){clearTimeout(timer);w.onerror=null;res(w);}};
        w.postMessage({type:'ping'});
      }));
    }
    return Promise.all(waits).then(function(ws){
      pool.workers=ws.filter(function(w){return w;});pool.ok=pool.workers.length;pool.mode=pool.ok?'workers':'main';
      return pool.ok;
    });
  }
  // run a list of jobs {theta,seed,K,cfg}; resolves with their fitness values in order
  function runJobs(jobs,onEach){
    return new Promise(function(resolve){
      var out=new Array(jobs.length),next=0,finished=0;
      function done(i,f){out[i]=f;finished++;if(onEach)onEach(finished,jobs.length);if(finished===jobs.length)resolve(out);}
      if(pool.workers.length){
        pool.workers.forEach(function(w){
          function feed(){
            if(next>=jobs.length)return;
            var i=next++,j=jobs[i];
            w.onmessage=function(ev){if(ev.data&&ev.data.type==='res'){done(i,ev.data.f);feed();}};
            w.postMessage({type:'job',id:i,theta:j.theta,seed:j.seed,K:j.K,cfg:j.cfg});
          }
          feed();
        });
      }else{
        (function step(){
          if(next>=jobs.length)return;
          var i=next++,j=jobs[i];
          done(i,RS.evalCandidate(j.theta,j.seed,j.K,j.cfg));
          setTimeout(step,0);
        })();
      }
    });
  }

  // training and Test use whichever reflexes are ticked (a policy learns to work together with them)
  function reflexCfg(){return {noReflex:!opt('oReflex'),flags:{nn:opt('oNN')?1:0,bal2:opt('oBal2')?1:0,step:opt('oStep')?1:0,air:opt('oFall')?1:0,land:opt('oFall')?1:0,fall:opt('oFall')?1:0,smooth:opt('oSmooth')?1:0,soft:opt('oSoft')?1:0}};}
  function reflexText(){return (opt('oReflex')?('balance'+(opt('oBal2')?' v2 + steps':(opt('oStep')?', step':''))+(opt('oFall')?', fall/landing':'')):'none')+(opt('oSmooth')?' · smooth reward':'')+(opt('oSoft')?' · soft start':'');}
  var training=false;
  function esGeneration(){
    var P=Math.max(2,Math.round(num('nPairs',12))),K=Math.max(1,Math.round(num('nScen',2)));
    var seed=1000+ES.gen*7919,eps=RS.esNoise(P,NP,seed+1),sg=ES.sigma,i,k;
    var cfg=reflexCfg();cfg.pushMax=Math.min(ES.pushMax,0.7+0.02*ES.gen);
    var jobs=[{theta:ES.theta.slice(),seed:seed,K:K,cfg:cfg}];
    for(i=0;i<P;i++){
      var tp=new Float64Array(NP),tm=new Float64Array(NP);
      for(k=0;k<NP;k++){tp[k]=ES.theta[k]+sg*eps[i][k];tm[k]=ES.theta[k]-sg*eps[i][k];}
      jobs.push({theta:tp,seed:seed,K:K,cfg:cfg});jobs.push({theta:tm,seed:seed,K:K,cfg:cfg});
    }
    ES.total=jobs.length;ES.done=0;
    return runJobs(jobs,function(d){ES.done=d;updateInfo();}).then(function(F){
      var Fp=[],Fm=[];for(i=0;i<P;i++){Fp.push(F[1+2*i]);Fm.push(F[2+2*i]);}
      var st=RS.esStep(ES,eps,Fp,Fm,sg,ES.lr);
      ES.gen++;ES.hist.push({cur:F[0],mean:st.mean,best:st.best});
    });
  }
  var info=document.getElementById('info'),chart=document.getElementById('chart'),cx=chart.getContext('2d');
  function updateInfo(){
    var h=ES.hist,l=h.length?h[h.length-1]:null;
    info.textContent='Generation '+ES.gen+(training?'  ('+ES.done+'/'+ES.total+')':'')+
      '\nrunning on: '+(pool.mode==='workers'?pool.ok+' worker threads':'main thread')+'\ntraining with reflexes: '+reflexText()+
      (l?'\nscore now '+l.cur.toFixed(0)+'  best '+l.best.toFixed(0):'')+(testText?'\n'+testText:'');
    cx.clearRect(0,0,chart.width,chart.height);
    if(!h.length)return;
    var lo=1e9,hi=-1e9;h.forEach(function(q){lo=Math.min(lo,q.cur,q.mean);hi=Math.max(hi,q.cur,q.mean);});
    if(hi-lo<1)hi=lo+1;
    var fg=getComputedStyle(document.body).color;
    cx.strokeStyle=fg;cx.globalAlpha=0.25;cx.lineWidth=1;cx.strokeRect(0.5,0.5,chart.width-1,chart.height-1);cx.globalAlpha=1;
    function line(key,color){
      cx.strokeStyle=color;cx.lineWidth=3;cx.beginPath();
      for(var i=0;i<h.length;i++){
        var x=h.length>1?i/(h.length-1)*(chart.width-8)+4:chart.width/2,y=chart.height-4-(h[i][key]-lo)/(hi-lo)*(chart.height-8);
        if(i===0)cx.moveTo(x,y);else cx.lineTo(x,y);
      }
      cx.stroke();
    }
    line('mean','#868e96');line('cur','#2f9e44');
  }
  var testText='';
  var bTrain=document.getElementById('bTrain');
  function setHint(t){hint.textContent=t;}
  bTrain.onclick=function(){
    if(training){training=false;bTrain.textContent='Start training';updateInfo();return;}
    training=true;bTrain.textContent='Stop training';setHint('Starting workers...');
    var want=Math.round(num('nWork',-1));
    if(want<0)want=Math.max(0,Math.min(8,(navigator.hardwareConcurrency||2)-1));
    (pool.ok&&pool.ok===want?Promise.resolve(pool.ok):startWorkers(want)).then(function(n){
      setHint(n?('Training on '+n+' worker threads.'):'Training on the main thread (workers unavailable or set to 0): the live view is paused.');
      updateInfo();
      (function loop(){
        if(!training){setHint('1 finger: drag ragdoll or pan · 2 fingers: zoom');return;}
        esGeneration().then(function(){updateInfo();setTimeout(loop,0);});
      })();
    });
  };
  document.getElementById('bResetP').onclick=function(){esReset();testText='';updateInfo();};
  document.getElementById('bTest').onclick=function(){
    if(training){setHint('Stop training first.');return;}
    setHint('Testing...');
    var go=function(){
      var jobs=[],cases=RS.CASES,zero=new Float64Array(NP);
      var rc=reflexCfg();
      function mk(c){return {only:c,pushMax:1.5,noReflex:rc.noReflex,flags:rc.flags};}
      cases.forEach(function(c){jobs.push({theta:ES.theta.slice(),seed:9000,K:6,cfg:mk(c)});});
      cases.forEach(function(c){jobs.push({theta:zero,seed:9000,K:6,cfg:mk(c)});});
      runJobs(jobs).then(function(F){
        var a=cases.map(function(c,i){return c+' '+F[i].toFixed(0)+' (base '+F[i+4].toFixed(0)+')';});
        testText='test ['+reflexText()+']: '+a.join(' · ');updateInfo();setHint('Done. "base" = the same reflexes with no network.');
      });
    };
    if(pool.ok)go();else startWorkers(Math.max(0,Math.min(8,(navigator.hardwareConcurrency||2)-1))).then(go);
  };

  // ---- save / load policy as a file ----
  function policyToText(){
    return JSON.stringify({format:'ragdoll-policy',version:3,np:NP,gen:ES.gen,theta:Array.prototype.slice.call(ES.theta),hist:ES.hist});
  }
  function loadFromText(text){
    var d=JSON.parse(text);
    var th=d&&RS.migrate(d.theta); // old files (4378 weights) are converted to the current network and behave the same
    if(!th)throw new Error('wrong file (expected '+NP+' weights, got '+(d&&d.theta?d.theta.length:'none')+')');
    ES.theta=th;ES.gen=d.gen||0;ES.hist=d.hist||[];
    ES.m=new Float64Array(NP);ES.v=new Float64Array(NP);ES.t=0;updateInfo();
  }
  document.getElementById('bSave').onclick=function(){
    var cl=window.claude;
    if(!cl||!cl.use){setHint('Saving files is not available here.');return;}
    cl.use('downloads').then(function(dl){
      if(!dl){setHint('Saving files is not available here.');return;}
      return dl.save({filename:'ragdoll-policy-gen'+ES.gen+'.json',data:policyToText()}).then(function(){setHint('Saved.');},
        function(e){setHint((e&&e.code==='declined')?'Save cancelled.':'Save failed: '+((e&&e.code)||e));});
    });
  };
  var fIn=document.getElementById('fIn');
  document.getElementById('bLoad').onclick=function(){fIn.value='';fIn.click();};
  fIn.onchange=function(){
    var f=fIn.files&&fIn.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){try{loadFromText(String(rd.result));setHint('Loaded '+f.name);}catch(e){setHint('Load failed: '+e.message);}};
    rd.onerror=function(){setHint('Could not read file.');};
    rd.readAsText(f);
  };

  // =====================================================================
  // LIVE WORLD
  // =====================================================================
  function init(){
    world=new planck.World({gravity:Vec2(0,-10)});
    drag=null;group=0;rigs=[];
    ground=world.createBody();ground.createFixture(Box(1000,1,Vec2(0,-1),0),{friction:0.9});
    spawn('stand');
  }
  var liveBufs=[];
  function spawn(kind){
    var x=cam.x+(rigs.length?(Math.random()-0.5)*0.6:-0.2);
    var sc=RS.sampleScenario(RS.rngMake((Math.random()*1e9)|0),{only:kind==='stand'?'stand':kind,pushMax:1.5});
    var o={pose:kind==='stand'?null:sc.pose,rootAng:kind==='stand'?0:sc.rootAng,h:kind==='drop'?Math.max(0.3,sc.h):0,clear:kind==='fallen'?0.01:0.02};
    RS.FLAGS.soft=opt('oSoft')?1:0;
    var rig=RS.buildRig(world,x,0,-(++group),o);
    if(kind==='drop'&&sc.vel)rig.parts.forEach(function(b){b.setLinearVelocity(Vec2(sc.vel.vx,sc.vel.vy));b.setAngularVelocity(sc.vel.w);});
    rigs.push(rig);liveBufs.push(RS.newBuf());
  }
  function hit(p){
    for(var b=world.getBodyList();b;b=b.getNext()){
      if(!b.isDynamic())continue;
      for(var f=b.getFixtureList();f;f=f.getNext())if(f.testPoint(p))return b;
    }
    return null;
  }
  function pick(sx,sy){
    var radii=[0,12,24,36];
    for(var i=0;i<radii.length;i++){
      var r=radii[i];
      if(r===0){var b0=hit(toWorld(sx,sy));if(b0)return {b:b0,sx:sx,sy:sy};continue;}
      for(var k=0;k<12;k++){
        var a=k*Math.PI/6,px=sx+Math.cos(a)*r,py=sy+Math.sin(a)*r,b=hit(toWorld(px,py));
        if(b)return {b:b,sx:px,sy:py};
      }
    }
    return null;
  }
  function islandMass(b){
    var seen=[b],st=[b],m=0;
    while(st.length){
      var x=st.pop();m+=x.getMass();
      for(var j=x.getJointList();j;j=j.next){
        var o=j.other;if(o&&o.isDynamic()&&seen.indexOf(o)<0){seen.push(o);st.push(o);}
      }
    }
    return m;
  }
  function applyDrag(){
    if(!drag)return;
    var b=drag.body;b.setAwake(true);
    var wp=b.getWorldPoint(drag.local),v=b.getLinearVelocityFromWorldPoint(wp);
    var ax=120*(drag.target.x-wp.x)-22*v.x,ay=120*(drag.target.y-wp.y)-22*v.y;
    var mag=Math.sqrt(ax*ax+ay*ay);if(mag>80){ax*=80/mag;ay*=80/mag;}
    var m=Math.max(drag.mass,b.getMass());
    b.applyForce(Vec2(ax*m,ay*m),wp,true);
  }

  var ptrs={},mode='none',pan=null,pinch=null;
  function ids(){return Object.keys(ptrs);}
  function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function startPinch(){
    var k=ids(),a=ptrs[k[0]],b=ptrs[k[1]];
    var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,w:toWorld(mx,my)};
    mode='pinch';drag=null;
  }
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    ptrs[e.pointerId]=pos(e);
    if(ids().length>=2){startPinch();return;}
    var p=ptrs[e.pointerId],h=pick(p.x,p.y);
    if(h){
      var wp=toWorld(h.sx,h.sy);
      drag={body:h.b,local:h.b.getLocalPoint(wp),target:toWorld(p.x,p.y),mass:islandMass(h.b)};
      mode='drag';
    }else{mode='pan';pan={x:p.x,y:p.y};}
  });
  cv.addEventListener('pointermove',function(e){
    if(!ptrs[e.pointerId])return;
    e.preventDefault();
    var p=pos(e);ptrs[e.pointerId]=p;
    if(mode==='pinch'&&ids().length>=2){
      var k=ids(),a=ptrs[k[0]],b=ptrs[k[1]];
      var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y)||1;
      cam.z=Math.max(15,Math.min(600,pinch.z*d/pinch.d));
      cam.x=pinch.w.x-(mx-W/2)/cam.z;cam.y=pinch.w.y+(my-H/2)/cam.z;
    }else if(mode==='drag'&&drag){drag.target=toWorld(p.x,p.y);}
    else if(mode==='pan'&&pan){cam.x-=(p.x-pan.x)/cam.z;cam.y+=(p.y-pan.y)/cam.z;pan={x:p.x,y:p.y};}
  });
  function up(e){
    delete ptrs[e.pointerId];
    var k=ids();
    if(k.length===0){mode='none';drag=null;pan=null;pinch=null;}
    else if(mode==='pinch'){mode='pan';pan={x:ptrs[k[0]].x,y:ptrs[k[0]].y};}
  }
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){e.preventDefault();var p=pos(e);setZoom(cam.z*Math.exp(-e.deltaY*0.002),p.x,p.y);},{passive:false});
  ['touchstart','touchmove','touchend','gesturestart','gesturechange'].forEach(function(n){
    document.addEventListener(n,function(e){if(e.target===cv)e.preventDefault();},{passive:false});
  });

  document.getElementById('bSpawn').onclick=function(){spawn('stand');};
  document.getElementById('bDrop').onclick=function(){spawn('drop');};
  document.getElementById('bFall').onclick=function(){spawn('fallen');};
  document.getElementById('bReset').onclick=init;
  document.getElementById('bIn').onclick=function(){setZoom(cam.z*1.4,W/2,H/2);};
  document.getElementById('bOut').onclick=function(){setZoom(cam.z/1.4,W/2,H/2);};
  function push(dir){
    var J=parseFloat(document.getElementById('pS').value)*dir;
    rigs.forEach(function(r){var c=r.parts[1];c.applyLinearImpulse(Vec2(J,0),c.getWorldCenter(),true);});
  }
  document.getElementById('pL').onclick=function(){push(-1);};
  document.getElementById('pR').onclick=function(){push(1);};
  document.getElementById('oUse').onchange=function(){
    if(!opt('oUse'))rigs.forEach(function(r){r.tgt.fill(0);r.stiff.fill(1);r.ctrls.forEach(function(c){c.target=0;});});
  };

  // ---------- draw ----------
  function polyPath(b,sh){
    var vs=sh.m_vertices;
    for(var i=0;i<vs.length;i++){
      var s=toScreen(b.getWorldPoint(vs[i]));
      if(i===0)ctx.moveTo(s.x,s.y);else ctx.lineTo(s.x,s.y);
    }
    ctx.closePath();
  }
  function drawBodies(far){
    for(var b=world.getBodyList();b;b=b.getNext()){
      if(!b.isDynamic())continue;
      var u=b.getUserData()||{};if(!!u.far!==far)continue;
      for(var f=b.getFixtureList();f;f=f.getNext()){ctx.beginPath();polyPath(b,f.getShape());ctx.stroke();}
    }
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    var fg=getComputedStyle(document.body).color;
    ctx.strokeStyle=fg;ctx.fillStyle=fg;ctx.lineWidth=2;
    var gy=toScreen(Vec2(0,0)).y;
    ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
    if(opt('oBox')){ctx.globalAlpha=0.4;drawBodies(true);ctx.globalAlpha=1;drawBodies(false);}
    if(opt('oNN')&&RS.hasDet()){ // what the network thinks is happening, above each head
      ctx.font='600 12px system-ui,Arial,sans-serif';ctx.textAlign='center';ctx.fillStyle=fg;
      rigs.forEach(function(r){
        var p=r.dp,b=0;for(var j=1;j<p.length;j++)if(p[j]>p[b])b=j;
        var hp=toScreen(r.parts[0].getPosition());
        ctx.globalAlpha=0.5+0.5*p[b];ctx.fillText(RS.DCLS[b]+' '+Math.round(p[b]*100)+'%',hp.x,hp.y-0.2*cam.z);ctx.globalAlpha=1;
      });
    }
    if(opt('oSkel')){
      ctx.lineWidth=3;ctx.strokeStyle='#e8590c';
      for(var b=world.getBodyList();b;b=b.getNext()){
        var u=b.getUserData();if(!u||!u.bone)continue;
        ctx.globalAlpha=u.far?0.4:1;
        var p1=toScreen(b.getWorldPoint(u.bone[0])),p2=toScreen(b.getWorldPoint(u.bone[1]));
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    if(opt('oJoint')){
      ctx.fillStyle='#1971c2';
      for(var j=world.getJointList();j;j=j.getNext()){var a=toScreen(j.getAnchorA());ctx.beginPath();ctx.arc(a.x,a.y,4,0,Math.PI*2);ctx.fill();}
    }
    if(opt('oCom')){
      rigs.forEach(function(r){
        var mx=0,my=0,M=0;
        r.parts.forEach(function(b){var c=b.getWorldCenter(),m=b.getMass();mx+=c.x*m;my+=c.y*m;M+=m;});
        var com=Vec2(mx/M,my/M),cs=toScreen(com),gs=toScreen(Vec2(com.x,0));
        var lo=1e9,hi=-1e9;
        r.feet.forEach(function(b){
          var vs=b.getFixtureList().getShape().m_vertices;
          for(var i=0;i<vs.length;i++){var w=b.getWorldPoint(vs[i]);if(w.y<0.03){lo=Math.min(lo,w.x);hi=Math.max(hi,w.x);}}
        });
        if(hi>lo){
          var a=toScreen(Vec2(lo,0)),c=toScreen(Vec2(hi,0));
          ctx.strokeStyle='#2f9e44';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
        }
        ctx.strokeStyle='#e03131';ctx.fillStyle='#e03131';ctx.lineWidth=1.5;
        ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(cs.x,cs.y);ctx.lineTo(gs.x,gs.y);ctx.stroke();ctx.setLineDash([]);
        ctx.beginPath();ctx.arc(cs.x,cs.y,6,0,Math.PI*2);ctx.fill();
      });
    }
  }

  var last=performance.now(),acc=0;
  function frame(t){
    var dt=Math.min((t-last)/1000,0.05);last=t;
    var paused=training&&pool.mode!=='workers'; // main-thread training: no time left for the live view
    if(!paused){
      if(opt('oSlow'))dt*=0.25;
      acc+=dt;
      var use=opt('oUse'),pd=opt('oPD'),reflex=opt('oReflex'),i;
      RS.FLAGS.air=RS.FLAGS.land=RS.FLAGS.fall=opt('oFall')?1:0;
      RS.FLAGS.step=opt('oStep')?1:0;RS.FLAGS.bal2=opt('oBal2')?1:0;RS.FLAGS.nn=opt('oNN')?1:0;
      while(acc>=DT){
        if((use||reflex)&&stepCount%SUB===0)for(i=0;i<rigs.length;i++)RS.act(rigs[i],use?ES.theta:ZERO_TH,liveBufs[i],liveRng,{delay:1,noise:0.005,reflex:reflex}); // reflexes run even when the policy is off (untrained = zero weights)
        if(pd)for(i=0;i<rigs.length;i++)RS.pdRig(rigs[i]);
        applyDrag();world.step(DT,RS.VEL_IT,RS.POS_IT);acc-=DT;stepCount++;
      }
    }
    draw();requestAnimationFrame(frame);
  }
  init();updateInfo();requestAnimationFrame(frame);
})();

</script>
</body>
</html>
