name: train

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Stop after this many minutes (max 340)'
        default: '330'
      pairs:
        description: 'Pairs per generation'
        default: '16'
      scenarios:
        description: 'Scenarios per candidate'
        default: '3'
      sigma:
        description: 'Noise size'
        default: '0.01'
      lr:
        description: 'Step size'
        default: '0.004'
      resume:
        description: 'Resume from resume.json in the repo (true/false)'
        default: 'false'
      smooth:
        description: 'Reward smooth, human-like motion (true/false)'
        default: 'true'
      soft:
        description: 'Soft start: ease into standing after spawning (true/false)'
        default: 'true'
      bal2:
        description: 'New balance: trunk upright + recovery steps (true/false)'
        default: 'true'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install planck@1.0.0
      - run: node train.js
        env:
          MINUTES: ${{ inputs.minutes }}
          PAIRS: ${{ inputs.pairs }}
          SCENARIOS: ${{ inputs.scenarios }}
          SIGMA: ${{ inputs.sigma }}
          LR: ${{ inputs.lr }}
          RESUME: ${{ inputs.resume }}
          SMOOTH: ${{ inputs.smooth }}
          SOFT: ${{ inputs.soft }}
          BAL2: ${{ inputs.bal2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragdoll-policy
          path: out/
      - name: Save results to the results branch
        if: always()
        run: |
          set -e
          D=runs/${{ github.run_number }}
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          if git fetch --depth=1 origin results 2>/dev/null; then
            git worktree add -B results /tmp/res FETCH_HEAD
          else
            git worktree add --orphan -b results /tmp/res
          fi
          cd /tmp/res
          mkdir -p "$D" && cp -r "$GITHUB_WORKSPACE"/out/. "$D"/
          git add "$D"
          git commit -m "Training results, run ${{ github.run_number }}"
          git push origin results
